[phases.setup]
nixPkgs = ["nodejs_22", "ffmpeg", "yt-dlp", "python3", "git", "curl", "gcc", "gnumake"]

[phases.install]
cmds = [
  "npm ci",
  "git clone --depth 1 --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git .bgutil-provider",
  "cd .bgutil-provider/server && npm ci && npx tsc",
  "curl -L -o .bgutil-ytdlp-pot-provider.zip https://github.com/Brainicism/bgutil-ytdlp-pot-provider/releases/latest/download/bgutil-ytdlp-pot-provider.zip"
]

[start]
cmd = "npm start"
