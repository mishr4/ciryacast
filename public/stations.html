<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMCast — Station Directory</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="TMCast">
<meta property="og:title" content="TMCast — Live Radio">
<meta property="og:description" content="Stream, request songs, and tune in to live stations on TMCast.">
<meta property="og:image" content="https://cast.tmc.gg/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://cast.tmc.gg/stations">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="TMCast — Live Radio">
<meta name="twitter:description" content="Stream, request songs, and tune in to live stations on TMCast.">
<meta name="twitter:image" content="https://cast.tmc.gg/share.png">
<meta name="theme-color" content="#08090b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/mavion.css?v=1">
<style>
  /* ── Page layout ── */
  .hero { max-width:1160px; margin:0 auto; padding:clamp(52px,10vw,104px) clamp(20px,5vw,40px) 40px; }
  .hero .kicker { margin-bottom:18px; }
  .hero .kicker .dot { width:6px; height:6px; border-radius:50%; background:var(--live); box-shadow:0 0 0 4px rgba(255,59,51,.14); }
  .hero h1 { font-size:clamp(2.4rem,6vw,4.3rem); margin-bottom:18px; max-width:14ch; }
  .hero p { font-size:1.05rem; color:var(--muted); max-width:520px; }

  .toolbar { max-width:1320px; margin:0 auto; padding:0 clamp(20px,5vw,40px) 40px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .search { flex:1; min-width:220px; }
  .search input {
    width:100%; padding:13px 18px; background:var(--card); border:1px solid var(--line-soft);
    border-radius:var(--r-sm); color:var(--ink); font-family:var(--sans); font-size:.92rem;
    outline:none; transition:border-color .2s var(--ease), background .2s var(--ease);
  }
  .search input::placeholder { color:var(--faint); }
  .search input:focus { border-color:var(--accent); background:var(--card-hover); }
  .filters { display:flex; gap:8px; }
  .pill {
    padding:11px 16px; background:var(--glass); border:1px solid var(--line-soft); border-radius:999px;
    color:var(--muted); font-family:var(--sans); font-size:.72rem; font-weight:600; text-transform:uppercase;
    letter-spacing:.08em; cursor:pointer; transition:all .2s var(--ease);
  }
  .pill:hover { color:var(--ink); border-color:var(--line); }
  .pill.active { color:var(--accent); border-color:var(--accent); background:rgba(76,141,255,.08); }

  .grid {
    max-width:1320px; margin:0 auto; padding:0 clamp(20px,5vw,40px);
    display:grid; grid-template-columns:repeat(auto-fill,minmax(228px,1fr)); gap:20px;
  }

  /* ── Station card (editorial) ── */
  .station-card {
    display:flex; flex-direction:column; background:var(--card);
    border:1px solid var(--line-soft); border-radius:var(--r-lg); overflow:hidden; cursor:pointer;
    animation:mv-rise .6s var(--ease) both;
    transition:transform .3s var(--ease), border-color .3s var(--ease), background .3s var(--ease);
  }
  .station-card:hover { transform:translateY(-4px); border-color:var(--line); background:var(--card-hover); }
  .station-card:hover .sc-cta { color:var(--accent); }
  .sc-cover { position:relative; aspect-ratio:1; background:var(--raised); overflow:hidden; }
  .sc-placeholder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--faint); }
  .sc-placeholder svg { width:44px; height:44px; opacity:.5; }
  .sc-art { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .sc-badges { position:absolute; top:12px; left:12px; right:12px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; pointer-events:none; }
  .sc-logo { width:32px; height:32px; border-radius:8px; object-fit:cover; border:1px solid var(--line); background:#000; }
  .sc-listeners {
    position:absolute; bottom:12px; left:12px; font-family:var(--sans); font-size:.68rem; font-weight:500;
    color:var(--ink-2); background:rgba(8,9,11,.62); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    padding:4px 9px; border-radius:999px; border:1px solid var(--line-soft);
  }
  .sc-body { padding:16px 18px 18px; display:flex; flex-direction:column; gap:5px; }
  .sc-name { font-family:var(--serif); font-weight:500; font-size:1.16rem; color:var(--ink); line-height:1.12; letter-spacing:-.015em; }
  .sc-np { font-size:.82rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sc-np b { color:var(--ink-2); font-weight:600; }
  .sc-cta { margin-top:8px; font-size:.78rem; font-weight:600; color:var(--muted); display:inline-flex; align-items:center; gap:6px; transition:color .25s var(--ease); }
  .sc-cta svg { width:12px; height:12px; }

  .empty { grid-column:1/-1; text-align:center; padding:90px 20px; color:var(--muted); }
  .empty h3 { font-size:1.4rem; margin-bottom:8px; }

  @media (max-width:600px) {
    .grid { grid-template-columns:repeat(2,1fr); gap:12px; }
    .sc-body { padding:12px 13px 14px; }
    .sc-name { font-size:1rem; }
    .toolbar { gap:10px; }
  }
</style>
</head>
<body>

<header class="mv-header">
  <a href="/stations" class="mv-logo"><img src="/logo.png" alt=""><b>TMCast</b></a>
  <nav class="mv-nav">
    <a href="/developers">Developers</a>
    <a href="https://tmc.gg/tmcast" class="btn btn-ghost">Get your station</a>
  </nav>
</header>

<section class="hero">
  <span class="kicker reveal"><span class="dot"></span>Live radio</span>
  <h1 class="reveal">Stations broadcasting now.</h1>
  <p class="reveal">Stream, request songs, and tune in to the stations on the TMCast network.</p>
</section>

<div class="toolbar reveal">
  <div class="search"><input id="search-input" placeholder="Search stations, genres…" oninput="filterStations(this.value)"></div>
  <div class="filters">
    <button class="pill active" onclick="setFilter('all', this)">All</button>
    <button class="pill" onclick="setFilter('live', this)">Live</button>
    <button class="pill" onclick="setFilter('online', this)">On air</button>
  </div>
</div>

<main class="grid" id="grid">
  <div class="empty"><h3>Loading…</h3></div>
</main>

<footer class="mv-footer">
  <span>TMCast · <a href="https://tmc.gg" target="_blank" rel="noopener">The Mavion Corporation</a></span>
  <span style="display:flex;gap:18px"><a href="/developers">Developer API</a><a href="/terms">Terms</a></span>
</footer>

<script src="/js/mavion.js"></script>
<script>
  const NOTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>';

  let allStations = [], activeFilter = 'all', searchQuery = '';
  const esc = s => { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
  const go = slug => { location.href = '/player/' + slug; };

  function setFilter(f, btn) {
    activeFilter = f;
    document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }
  function filterStations(q) { searchQuery = q.toLowerCase(); render(); }

  function render() {
    const grid = document.getElementById('grid');
    let list = allStations;
    if (activeFilter === 'live') list = list.filter(s => s.live);
    else if (activeFilter === 'online') list = list.filter(s => s.now_playing && !s.live);
    if (searchQuery) {
      list = list.filter(s =>
        s.station.name.toLowerCase().includes(searchQuery) ||
        (s.station.genre || '').toLowerCase().includes(searchQuery) ||
        (s.station.description || '').toLowerCase().includes(searchQuery));
    }
    if (!list.length) {
      grid.innerHTML = '<div class="empty"><h3>No stations found</h3><p>Try a different search or filter.</p></div>';
      return;
    }
    grid.innerHTML = list.map((s, i) => {
      const np = s.now_playing, live = s.live;
      const hasAudio = np && np.title !== 'Unknown';
      const album = (hasAudio && np.artwork_url) ? np.artwork_url : '';
      const logo = s.station.logo_url || '';
      const mainArt = album || logo || '';
      const showLogo = !!(album && logo);      // logo badge only when album art is the main image
      const slug = s.station.slug || s.station.id;
      const genre = s.station.genre || s.station.description || 'Radio';
      const listeners = s.listeners && s.listeners.current || 0;
      return `
        <div class="station-card" role="link" tabindex="0" style="animation-delay:${Math.min(i * 32, 380)}ms"
             onclick="go('${slug}')" onkeydown="if(event.key==='Enter')go('${slug}')">
          <div class="sc-cover">
            <div class="sc-placeholder">${NOTE}</div>
            ${mainArt ? `<img class="sc-art" src="${esc(mainArt)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
            <div class="sc-badges">
              ${showLogo ? `<img class="sc-logo" src="${esc(logo)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '<span></span>'}
              ${live ? '<span class="tag tag-live"><span class="dot"></span>Live</span>' : '<span></span>'}
            </div>
            ${listeners > 0 ? `<span class="sc-listeners">${listeners} listening</span>` : ''}
          </div>
          <div class="sc-body">
            <span class="kicker faint">${esc(genre)}</span>
            <div class="sc-name">${esc(s.station.name)}</div>
            <div class="sc-np">${hasAudio ? `<b>${esc(np.artist)}</b> — ${esc(np.title)}` : (live ? 'On air now' : 'Offline')}</div>
            <span class="sc-cta">${PLAY} Listen</span>
          </div>
        </div>`;
    }).join('');
  }

  async function load() {
    try {
      const res = await fetch('/api/nowplaying');
      allStations = await res.json();
      render();
    } catch { document.getElementById('grid').innerHTML = '<div class="empty"><h3>Failed to load</h3></div>'; }
  }

  load();
  setInterval(load, 10000);

  // WS nudges a refresh, debounced so a burst of events doesn't hammer the API
  let wsLoadTimer = null;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = () => { clearTimeout(wsLoadTimer); wsLoadTimer = setTimeout(load, 750); };
  ws.onclose = () => setTimeout(() => location.reload(), 5000);
</script>
</body>
</html>
