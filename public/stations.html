<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiryaCast — Station Directory</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0a12;
    --card: #13131f;
    --card-hover: #1a1a2e;
    --border: rgba(255,255,255,0.06);
    --text: #fff;
    --muted: rgba(255,255,255,0.45);
    --accent: #7C4DFF;
    --pink: #FF48BC;
  }
  body {
    font-family: 'Instrument Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Nav */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 40px;
    background: rgba(10,10,18,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
  .nav-logo img { width: 32px; height: 32px; border-radius: 8px; object-fit: contain; }
  .nav-logo span { font-family: 'Lexend', sans-serif; font-size: 16px; font-weight: 600; }
  .nav-right { display: flex; gap: 12px; }
  .nav-btn {
    padding: 8px 20px; border-radius: 10px; font-size: 13px; font-weight: 600;
    text-decoration: none; border: none; cursor: pointer; font-family: inherit;
    transition: all 0.2s;
  }
  .nav-btn-ghost { background: rgba(255,255,255,0.06); color: var(--text); }
  .nav-btn-ghost:hover { background: rgba(255,255,255,0.1); }
  .nav-btn-primary { background: var(--accent); color: #fff; }
  .nav-btn-primary:hover { opacity: 0.9; }

  /* Hero */
  .hero {
    padding: 140px 40px 64px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .hero-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--accent); margin-bottom: 20px;
  }
  .hero-tag::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .hero h1 {
    font-family: 'Lexend', sans-serif;
    font-size: clamp(36px, 5vw, 64px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1px;
    margin-bottom: 16px;
  }
  .hero h1 span { color: var(--accent); }
  .hero p { font-size: 17px; color: var(--muted); max-width: 480px; line-height: 1.6; }

  /* Search */
  .search-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 40px 40px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-input {
    flex: 1;
    min-width: 220px;
    padding: 12px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: rgba(124,77,255,0.4); }
  .search-input::placeholder { color: var(--muted); }

  .filter-btn {
    padding: 12px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover, .filter-btn.active { border-color: var(--accent); color: var(--text); }

  /* Grid */
  .grid {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 40px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .station-card {
    background: var(--card);
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    color: var(--text);
  }
  .station-card:hover {
    border-color: rgba(124,77,255,0.3);
    background: var(--card-hover);
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }

  .card-logo {
    width: 100%;
    aspect-ratio: 1;
    background: linear-gradient(135deg, #1a1030, #0d1a30);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .card-logo img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .card-logo-placeholder {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, var(--accent), var(--pink));
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .card-logo-placeholder svg { width: 28px; height: 28px; color: #fff; }

  .live-badge {
    position: absolute; top: 10px; left: 10px;
    display: flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    background: rgba(255,23,68,0.9); color: #fff;
    backdrop-filter: blur(8px);
  }
  .live-dot { width: 5px; height: 5px; border-radius: 50%; background: #fff; animation: pulse 1.5s ease-in-out infinite; }

  .listeners-badge {
    position: absolute; top: 10px; right: 10px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 10px; font-weight: 600;
    background: rgba(0,0,0,0.5); color: rgba(255,255,255,0.7);
    backdrop-filter: blur(8px);
  }

  .card-info { padding: 14px 16px; }
  .card-name { font-family: 'Lexend', sans-serif; font-size: 15px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-genre { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .card-np {
    font-size: 12px; color: rgba(255,255,255,0.55);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-np strong { color: rgba(255,255,255,0.8); font-weight: 500; }

  .card-actions {
    display: flex;
    border-top: 1px solid var(--border);
  }
  .card-action {
    flex: 1; padding: 10px 8px;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-size: 12px; font-weight: 600; color: var(--muted);
    text-decoration: none; background: none; border: none; cursor: pointer;
    font-family: inherit; transition: all 0.15s;
    border-right: 1px solid var(--border);
  }
  .card-action:last-child { border-right: none; }
  .card-action:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .card-action.primary:hover { color: var(--accent); }
  .card-action svg { width: 13px; height: 13px; }

  /* Empty */
  .empty {
    grid-column: 1 / -1;
    text-align: center; padding: 80px 20px;
    color: var(--muted);
  }
  .empty h3 { font-family: 'Lexend', sans-serif; font-size: 20px; color: var(--text); margin-bottom: 8px; }

  @media (max-width: 600px) {
    .nav { padding: 14px 20px; }
    .hero { padding: 100px 20px 40px; }
    .search-wrap { padding: 0 20px 24px; }
    .grid { padding: 0 20px 60px; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card-info { padding: 12px; }
    .card-name { font-size: 13px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="/stations" class="nav-logo">
    <img src="https://onqhdxzmsvmelmdohcxv.supabase.co/storage/v1/object/public/staff-photos/library/frame-59-7-mpzsv3b7.png" alt="TMC">
    <span>CiryaCast</span>
  </a>
  <div class="nav-right">
    <a href="https://tmc.gg/ciryacast" class="nav-btn nav-btn-ghost">Get Your Station</a>
  </div>
</nav>

<div class="hero">
  <div class="hero-tag">Live Radio</div>
  <h1>Listen to stations<br><span>broadcasting now.</span></h1>
  <p>Stream, request songs, and tune in to stations on the CiryaCast network.</p>
</div>

<div class="search-wrap">
  <input class="search-input" id="search-input" placeholder="Search stations..." oninput="filterStations(this.value)">
  <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" onclick="setFilter('live', this)">🔴 Live</button>
  <button class="filter-btn" onclick="setFilter('online', this)">On Air</button>
</div>

<div class="grid" id="grid">
  <div class="empty"><h3>Loading...</h3></div>
</div>

<script>
  let allStations = [];
  let activeFilter = 'all';
  let searchQuery = '';

  function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function setFilter(f, btn) {
    activeFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function filterStations(q) {
    searchQuery = q.toLowerCase();
    render();
  }

  function render() {
    const grid = document.getElementById('grid');
    let filtered = allStations;

    if (activeFilter === 'live') filtered = filtered.filter(s => s.live);
    else if (activeFilter === 'online') filtered = filtered.filter(s => s.now_playing && !s.live);

    if (searchQuery) {
      filtered = filtered.filter(s =>
        s.station.name.toLowerCase().includes(searchQuery) ||
        (s.station.genre || '').toLowerCase().includes(searchQuery) ||
        (s.station.description || '').toLowerCase().includes(searchQuery)
      );
    }

    if (!filtered.length) {
      grid.innerHTML = '<div class="empty"><h3>No stations found</h3><p>Try a different search or filter</p></div>';
      return;
    }

    grid.innerHTML = filtered.map(s => {
      const np = s.now_playing;
      const live = s.live;
      const hasAudio = np && np.title !== 'Unknown';
      const logo = s.station.logo_url || '';
      const artUrl = np?.artwork_url || logo;

      return `
        <a class="station-card" href="/player/${s.station.id}">
          <div class="card-logo">
            ${artUrl
              ? `<img src="${esc(artUrl)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
              : ''
            }
            <div class="card-logo-placeholder" ${artUrl ? 'style="display:none"' : ''}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </div>
            ${live ? `<div class="live-badge"><div class="live-dot"></div>LIVE</div>` : ''}
            ${s.listeners.current > 0 ? `<div class="listeners-badge">${s.listeners.current} listening</div>` : ''}
          </div>
          <div class="card-info">
            <div class="card-name">${esc(s.station.name)}</div>
            <div class="card-genre">${esc(s.station.genre || s.station.description || 'Radio')}</div>
            ${hasAudio
              ? `<div class="card-np"><strong>${esc(np.artist)}</strong> — ${esc(np.title)}</div>`
              : `<div class="card-np" style="color:rgba(255,255,255,0.25)">${live ? 'Broadcasting live' : 'Offline'}</div>`
            }
          </div>
          <div class="card-actions">
            <a class="card-action primary" href="/player/${s.station.id}" onclick="event.stopPropagation()">
              <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
              Listen
            </a>
            <button class="card-action" onclick="event.preventDefault();event.stopPropagation();copyStream('${s.listen_url}')" title="Copy stream URL">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              Stream
            </button>
          </div>
        </a>
      `;
    }).join('');
  }

  function copyStream(path) {
    navigator.clipboard.writeText(location.origin + path);
    // brief flash on the button is enough feedback
  }

  async function load() {
    try {
      const res = await fetch('/api/nowplaying');
      allStations = await res.json();
      render();
    } catch {
      document.getElementById('grid').innerHTML = '<div class="empty"><h3>Failed to load</h3></div>';
    }
  }

  load();
  setInterval(load, 10000);

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = load;
  ws.onclose = () => setTimeout(() => location.reload(), 5000);
</script>
</body>
</html>
