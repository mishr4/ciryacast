<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMCast — Sign In</title>
<meta property="og:title" content="TMCast — Live Radio">
<meta property="og:description" content="Internet radio by The Mavion Corporation.">
<meta property="og:image" content="https://cast.tmc.gg/share.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://cast.tmc.gg/share.png">
<meta name="theme-color" content="#08090b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/mavion.css?v=1">
<style>
  body { display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-wrap { width:400px; max-width:100%; }

  .logo-row { display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .logo-row img { width:38px; height:38px; object-fit:contain; }
  .logo-text h1 { font-family:var(--serif); font-size:1.4rem; font-weight:500; letter-spacing:-.01em; color:var(--ink); }
  .logo-text p { font-size:.74rem; color:var(--faint); text-transform:uppercase; letter-spacing:.12em; font-weight:600; margin-top:2px; }

  .login-card { background:var(--card); border:1px solid var(--line-soft); border-radius:var(--r-feat); padding:34px 30px; box-shadow:var(--shadow); }
  .login-card h2 { font-family:var(--serif); font-size:1.5rem; font-weight:500; color:var(--ink); margin-bottom:6px; }
  .login-card > p { font-size:.9rem; color:var(--muted); margin-bottom:26px; line-height:1.55; }

  .field {
    width:100%; padding:12px 15px; margin-bottom:10px; border-radius:var(--r-sm);
    background:var(--glass); border:1px solid var(--line); color:var(--ink);
    font-family:var(--sans); font-size:.92rem; outline:none; transition:border-color .2s var(--ease), background .2s var(--ease);
  }
  .field::placeholder { color:var(--faint); }
  .field:focus { border-color:var(--accent); background:var(--card-hover); }

  /* base = ghost; the SSO button (#btn-sso) is the blue primary */
  .btn-sso {
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    padding:13px 22px; border-radius:var(--r-sm); font-family:var(--sans); font-size:.94rem; font-weight:600;
    background:var(--glass); border:1px solid var(--line); color:var(--ink); cursor:pointer;
    transition:background .25s var(--ease), border-color .25s var(--ease), transform .25s var(--ease);
  }
  .btn-sso:hover { background:var(--glass-2); border-color:var(--glass-2); transform:translateY(-1px); }
  .btn-sso svg { width:19px; height:19px; }
  #btn-sso { background:var(--accent); border-color:transparent; color:#08090b; }
  #btn-sso:hover { background:var(--accent-hover); }

  .divider { display:flex; align-items:center; gap:12px; margin:22px 0; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--line); }
  .divider span { font-size:.66rem; color:var(--faint); font-weight:600; text-transform:uppercase; letter-spacing:.12em; }

  .status-msg { font-size:.82rem; color:var(--muted); padding:12px 14px; border-radius:var(--r-sm); background:var(--glass); border:1px solid var(--line-soft); }
  .status-msg.success { color:#7ee0b0; background:rgba(62,207,142,.1); border-color:rgba(62,207,142,.22); }
  .status-msg.error { color:#ff8a85; background:rgba(255,59,51,.1); border-color:rgba(255,59,51,.24); }

  .tmc-footer { margin-top:24px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:.72rem; color:var(--faint); }
  .tmc-footer a { color:var(--muted); text-decoration:none; }
  .tmc-footer a:hover { color:var(--ink); }

  .user-card { display:none; align-items:center; gap:14px; padding:16px; background:var(--glass); border:1px solid var(--line); border-radius:var(--r); margin-bottom:16px; text-align:left; }
  .user-card.show { display:flex; }
  .user-avatar { width:44px; height:44px; border-radius:12px; background:var(--raised); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; color:var(--ink); flex-shrink:0; overflow:hidden; }
  .user-avatar img { width:100%; height:100%; object-fit:cover; }
  .user-info h3 { font-family:var(--sans); font-size:.94rem; font-weight:600; color:var(--ink); }
  .user-info p { font-size:.78rem; color:var(--muted); }

  .badge { padding:3px 10px; border-radius:999px; font-size:.62rem; font-weight:600; text-transform:uppercase; letter-spacing:.06em; background:var(--glass-2); color:var(--muted); border:1px solid var(--line-soft); }
  .badge-staff, .badge-founder { color:var(--accent); background:rgba(76,141,255,.1); border-color:rgba(76,141,255,.25); }

  .btn-enter { display:block; width:100%; padding:13px; border-radius:var(--r-sm); background:var(--accent); color:#08090b; font-family:var(--sans); font-size:.94rem; font-weight:600; border:none; cursor:pointer; transition:background .25s var(--ease), transform .25s var(--ease); text-decoration:none; text-align:center; }
  .btn-enter:hover { background:var(--accent-hover); transform:translateY(-1px); }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="logo-row">
    <img src="/logo.png" alt="TMC">
    <div class="logo-text">
      <h1>TMCast</h1>
      <p>The Mavion Corporation</p>
    </div>
  </div>

  <div class="login-card">
    <h2>Sign in to continue</h2>
    <p>Sign in with your staff account to access the TMCast dashboard.</p>

    <!-- User card (shown after login) -->
    <div class="user-card" id="user-card">
      <div class="user-avatar" id="user-avatar">?</div>
      <div class="user-info">
        <h3 id="user-name">—</h3>
        <p id="user-handle">—</p>
      </div>
      <span class="badge" id="user-badge"></span>
    </div>

    <div id="login-area">
      <form id="login-form" onsubmit="doEmailLogin(event)" style="margin-bottom:18px">
        <input type="email" id="login-email" class="field" placeholder="Email" required>
        <input type="password" id="login-password" class="field" placeholder="Password" required>
        <button type="submit" class="btn-sso" style="margin-top:4px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Sign In
        </button>
      </form>

      <div class="divider"><span>or</span></div>

      <button class="btn-sso" id="btn-sso" onclick="doSignIn()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
        Sign in with Mavion
      </button>
    </div>

    <a class="btn-enter" id="btn-enter" href="/" style="display:none">Enter Dashboard</a>

    <div id="status-area" style="margin-top:16px"></div>
  </div>

  <div class="tmc-footer">
    <span>Powered by</span>
    <a href="https://tmc.gg" target="_blank" rel="noopener">TMC</a>
    <span>&middot;</span>
    <a href="https://tmc.gg" target="_blank" rel="noopener">The Mavion Corporation</a>
  </div>
</div>

<script>
  async function doEmailLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) return showStatus('Enter email and password', 'error');

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        showStatus(data.error || 'Login failed', 'error');
        return;
      }

      // Store user + their assigned stations
      const user = {
        ...data.user,
        display_name: data.user.display_name || email,
        auth_type: 'local',
        assigned_stations: data.stations,
      };
      sessionStorage.setItem('ciryacast_user', JSON.stringify(user));
      showUser(user);
      showStatus('Signed in!', 'success');
    } catch (err) {
      showStatus('Connection error — try again', 'error');
    }
  }

  // Hand off to MavionSSO (sso.tmc.gg). It signs the user in via Discord/Google,
  // then redirects back to ?return= with a `cirya_sso` identity payload we decode.
  function doSignIn() {
    sessionStorage.setItem('tmcast_sso_pending', '1');
    const ret = window.location.origin + '/login';
    window.location.href = 'https://sso.tmc.gg/?return=' + encodeURIComponent(ret);
  }

  function showStatus(msg, type) {
    document.getElementById('status-area').innerHTML =
      `<div class="status-msg ${type || ''}">${msg}</div>`;
  }

  function avatarFallback(user) {
    const name = encodeURIComponent(user.display_name || user.email || '?');
    return `https://ui-avatars.com/api/?name=${name}&size=96&background=4C8DFF&color=fff&rounded=true&bold=true`;
  }
  function getAvatarUrl(user) {
    // 1) direct pfp carried in the SSO identity
    const direct = user.avatar_url || user.profile_picture || user.photo_url || user.picture || '';
    if (direct) return direct;
    // 2) MavionSSO avatar API (302s to their pfp) — by id, then handle
    if (user.id) return `https://sso.tmc.gg/api/avatar?id=${encodeURIComponent(user.id)}`;
    if (user.cirya_handle) return `https://sso.tmc.gg/api/avatar?handle=${encodeURIComponent(user.cirya_handle)}`;
    // 3) generated initials (the API's own fallback points at a dead URL)
    return avatarFallback(user);
  }

  function showUser(user) {
    document.getElementById('user-card').classList.add('show');
    document.getElementById('user-name').textContent = user.display_name || user.cirya_handle || 'User';
    document.getElementById('user-handle').textContent = user.cirya_handle ? '@' + user.cirya_handle : user.email || '';

    const avatar = document.getElementById('user-avatar');
    const pic = getAvatarUrl(user);
    if (pic) {
      avatar.innerHTML = `<img src="${pic}" alt="" onerror="this.onerror=null;this.src='${avatarFallback(user)}'">`;
    } else {
      avatar.textContent = (user.display_name || '?')[0].toUpperCase();
    }

    const badge = document.getElementById('user-badge');
    const status = user.status || 'Member';
    badge.textContent = status;
    badge.className = 'badge badge-' + status.toLowerCase();

    document.getElementById('login-area').style.display = 'none';
    document.getElementById('btn-enter').style.display = 'block';

    // Store auth in sessionStorage
    sessionStorage.setItem('ciryacast_user', JSON.stringify(user));
  }

  // MavionSSO hands the signed-in identity back as ?cirya_sso=<base64url JSON>.
  // Decode it (mirrors the SDK's old encode) and reject it if it's expired.
  function readSsoHandoff() {
    const raw = new URLSearchParams(location.search).get('cirya_sso');
    if (!raw) return null;
    try {
      let b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      const data = JSON.parse(decodeURIComponent(escape(atob(b64))));
      if (data && data.exp && data.exp < Date.now()) return null; // stale token
      return data && data.user ? data.user : null;
    } catch { return null; }
  }

  // Sign in and go STRAIGHT to the dashboard (no "Enter Dashboard" click).
  function enterWithSso(ssoUser) {
    const user = { ...ssoUser, auth_type: 'sso' };
    sessionStorage.setItem('ciryacast_user', JSON.stringify(user));
    sessionStorage.removeItem('tmcast_sso_pending');
    history.replaceState(null, '', location.pathname);
    window.location.replace('/');
  }

  async function checkAuth() {
    const rawToken = new URLSearchParams(location.search).get('cirya_sso');
    const pending = sessionStorage.getItem('tmcast_sso_pending') === '1';

    // 1) URL token — MavionSSO includes ?cirya_sso= only for cross-site returns.
    const ssoUser = readSsoHandoff();
    if (ssoUser) return enterWithSso(ssoUser);

    // 2) Cookie identity — for tmc.gg subdomains MavionSSO does NOT put the token
    //    in the URL; cast.tmc.gg instead reads the signed-in user from the shared
    //    cookie via /api/me (CORS + credentials are configured for us there).
    if (pending) showStatus('Signing you in…', '');
    try {
      const r = await fetch('https://sso.tmc.gg/api/me', { credentials: 'include' });
      if (r.ok) {
        const d = await r.json();
        if (d && d.user && (d.user.email || d.user.id)) return enterWithSso(d.user);
      }
    } catch {}
    sessionStorage.removeItem('tmcast_sso_pending');

    // Token was present but unreadable — surface it instead of silent logout.
    if (rawToken) {
      showStatus('Could not read the sign-in from Mavion — please try again.', 'error');
      history.replaceState(null, '', location.pathname);
    } else if (pending) {
      document.getElementById('status-area').innerHTML = ''; // clear the spinner text
    }

    // 3) Existing local session in this browser.
    const stored = sessionStorage.getItem('ciryacast_user');
    if (stored) {
      try { showUser(JSON.parse(stored)); } catch {}
    }
  }

  checkAuth();
</script>
</body>
</html>
