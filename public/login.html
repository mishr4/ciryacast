<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiryaCast — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Instrument Sans', 'Inter', sans-serif;
    background: linear-gradient(135deg, #fef6f0, #fdf2fd, #f0eaff, #fef6f0, #fdf2fd);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
    color: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    25% { background-position: 100% 25%; }
    50% { background-position: 100% 50%; }
    75% { background-position: 0% 75%; }
    100% { background-position: 0% 50%; }
  }

  .login-wrap {
    text-align: center;
    width: 400px;
    max-width: 90vw;
  }

  .logo-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .logo-row img {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    object-fit: contain;
  }

  .logo-text h1 {
    font-family: 'Lexend', sans-serif;
    font-size: 22px;
    font-weight: 600;
    text-align: left;
    letter-spacing: -0.3px;
  }

  .logo-text p {
    font-size: 12px;
    color: #777;
    text-align: left;
    font-weight: 500;
  }

  .login-card {
    background: #fff;
    border-radius: 22px;
    padding: 40px 32px;
    margin-top: 28px;
    box-shadow: 0 1px 21px rgba(0,0,0,0.08);
  }

  .login-card h2 {
    font-family: 'Lexend', sans-serif;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .login-card p {
    font-size: 14px;
    color: #777;
    margin-bottom: 28px;
    line-height: 1.5;
  }

  /* Hide the CiryaSSO SDK-rendered button entirely */
  .sso-mount,
  [data-cirya-sso],
  .cirya-sso-btn,
  .cirya-sso-widget,
  [class*="cirya-sso"] {
    display: none !important;
  }

  .btn-sso {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 14px 24px;
    border-radius: 14px;
    background: #000;
    color: #fff;
    font-family: 'Instrument Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  }

  .btn-sso:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }

  .btn-sso svg { width: 20px; height: 20px; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(0,0,0,0.06);
  }

  .divider span {
    font-size: 11px;
    color: #aaa;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .status-msg {
    font-size: 13px;
    color: #777;
    padding: 12px;
    border-radius: 12px;
    background: #fafafa;
    border: 1px solid rgba(0,0,0,0.04);
  }

  .status-msg.success {
    color: #2e7d32;
    background: #e8f5e9;
    border-color: rgba(0,200,83,0.15);
  }

  .status-msg.error {
    color: #c62828;
    background: #fce4ec;
    border-color: rgba(255,42,42,0.15);
  }

  .tmc-footer {
    margin-top: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11px;
    color: #aaa;
  }

  .tmc-footer a { color: #777; text-decoration: none; font-weight: 600; }
  .tmc-footer a:hover { color: #7C4DFF; }

  .user-card {
    display: none;
    align-items: center;
    gap: 14px;
    padding: 16px;
    background: #faf8ff;
    border: 1px solid rgba(124,77,255,0.1);
    border-radius: 14px;
    margin-bottom: 16px;
    text-align: left;
  }

  .user-card.show { display: flex; }

  .user-avatar {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #7C4DFF, #FF48BC);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
    overflow: hidden;
  }

  .user-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .user-info h3 { font-family: 'Instrument Sans', sans-serif; font-size: 15px; font-weight: 600; }
  .user-info p { font-size: 12px; color: #777; }

  .badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .badge-staff { background: #f0eaff; color: #7C4DFF; }
  .badge-founder { background: #fff0f7; color: #FF48BC; }
  .badge-plus { background: #e0f7fa; color: #0097a7; }
  .badge-member { background: #f5f5f5; color: #777; }

  .btn-enter {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    background: var(--accent-green, #00C853);
    color: #fff;
    font-family: 'Instrument Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(0,200,83,0.25);
    text-decoration: none;
    text-align: center;
  }

  .btn-enter:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,200,83,0.35); }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="logo-row">
    <img src="https://onqhdxzmsvmelmdohcxv.supabase.co/storage/v1/object/public/staff-photos/library/frame-59-7-mpzsv3b7.png" alt="TMC">
    <div class="logo-text">
      <h1>CiryaCast</h1>
      <p>The Mishra Corporation</p>
    </div>
  </div>

  <div class="login-card">
    <h2>Sign in to continue</h2>
    <p>Use your Cirya account to access the CiryaCast dashboard.</p>

    <!-- User card (shown after login) -->
    <div class="user-card" id="user-card">
      <div class="user-avatar" id="user-avatar">?</div>
      <div class="user-info">
        <h3 id="user-name">—</h3>
        <p id="user-handle">—</p>
      </div>
      <span class="badge" id="user-badge"></span>
    </div>

    <div id="login-area">
      <!-- Email/Password login -->
      <form id="login-form" onsubmit="doEmailLogin(event)" style="margin-bottom:20px">
        <input type="email" id="login-email" placeholder="Email" style="width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid rgba(0,0,0,0.08);font-family:inherit;font-size:14px;outline:none;margin-bottom:10px;background:#fafafa" required>
        <input type="password" id="login-password" placeholder="Password" style="width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid rgba(0,0,0,0.08);font-family:inherit;font-size:14px;outline:none;margin-bottom:14px;background:#fafafa" required>
        <button type="submit" class="btn-sso" style="width:100%">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Sign In
        </button>
      </form>

      <div class="divider"><span>or</span></div>

      <!-- CiryaSSO -->
      <div class="sso-mount">
        <div data-cirya-sso></div>
      </div>

      <button class="btn-sso" id="btn-sso" onclick="doSignIn()" style="background:#7C4DFF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
        Sign in with CiryaSSO
      </button>
    </div>

    <a class="btn-enter" id="btn-enter" href="/" style="display:none">Enter Dashboard</a>

    <div id="status-area" style="margin-top:16px"></div>
  </div>

  <div class="tmc-footer">
    <span>Powered by</span>
    <a href="https://tmc.gg" target="_blank">TMC</a>
    <span>&middot;</span>
    <a href="https://cirya.co" target="_blank">Cirya</a>
  </div>
</div>

<script>
  window.ciryaSsoConfig = {
    theme: 'light',
    position: 'inline',
    showWhenSignedIn: false,
  };
</script>
<script src="https://cirya.co/sso-sdk.js?v=3" async></script>
<script>
  async function doEmailLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) return showStatus('Enter email and password', 'error');

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        showStatus(data.error || 'Login failed', 'error');
        return;
      }

      // Store user + their assigned stations
      const user = {
        ...data.user,
        display_name: data.user.display_name || email,
        auth_type: 'local',
        assigned_stations: data.stations,
      };
      sessionStorage.setItem('ciryacast_user', JSON.stringify(user));
      showUser(user);
      showStatus('Signed in!', 'success');
    } catch (err) {
      showStatus('Connection error — try again', 'error');
    }
  }

  function doSignIn() {
    if (window.CiryaSSO) {
      CiryaSSO.signIn(window.location.origin + '/login');
    } else {
      showStatus('CiryaSSO is loading, try again in a moment...', 'error');
    }
  }

  function showStatus(msg, type) {
    document.getElementById('status-area').innerHTML =
      `<div class="status-msg ${type || ''}">${msg}</div>`;
  }

  // Simple MD5 for Gravatar
  function md5(s){var h=0x67452301,g=0xEFCDAB89,f=0x98BADCFE,e=0x10325476;function c(a,b){return(a<<b)|(a>>>(32-b))}s=unescape(encodeURIComponent(s));var j=[];for(var i=0;i<s.length;i++)j.push(s.charCodeAt(i));j.push(128);while(j.length%64!==56)j.push(0);var lo=s.length*8;j.push(lo&0xff,(lo>>8)&0xff,(lo>>16)&0xff,(lo>>24)&0xff,0,0,0,0);for(var i=0;i<j.length;i+=64){var a=h,b=g,cc=f,dd=e;var w=[];for(var k=0;k<16;k++)w[k]=j[i+k*4]|(j[i+k*4+1]<<8)|(j[i+k*4+2]<<16)|(j[i+k*4+3]<<24);var S=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];var T=[0xd76aa478,0xe8c7b756,0x242070db,0xc1bdceee,0xf57c0faf,0x4787c62a,0xa8304613,0xfd469501,0x698098d8,0x8b44f7af,0xffff5bb1,0x895cd7be,0x6b901122,0xfd987193,0xa679438e,0x49b40821,0xf61e2562,0xc040b340,0x265e5a51,0xe9b6c7aa,0xd62f105d,0x02441453,0xd8a1e681,0xe7d3fbc8,0x21e1cde6,0xc33707d6,0xf4d50d87,0x455a14ed,0xa9e3e905,0xfcefa3f8,0x676f02d9,0x8d2a4c8a,0xfffa3942,0x8771f681,0x6d9d6122,0xfde5380c,0xa4beea44,0x4bdecfa9,0xf6bb4b60,0xbebfbc70,0x289b7ec6,0xeaa127fa,0xd4ef3085,0x04881d05,0xd9d4d039,0xe6db99e5,0x1fa27cf8,0xc4ac5665,0xf4292244,0x432aff97,0xab9423a7,0xfc93a039,0x655b59c3,0x8f0ccc92,0xffeff47d,0x85845dd1,0x6fa87e4f,0xfe2ce6e0,0xa3014314,0x4e0811a1,0xf7537e82,0xbd3af235,0x2ad7d2bb,0xeb86d391];for(var k=0;k<64;k++){var F,gi;if(k<16){F=(b&cc)|((~b)&dd);gi=k}else if(k<32){F=(dd&b)|((~dd)&cc);gi=(5*k+1)%16}else if(k<48){F=b^cc^dd;gi=(3*k+5)%16}else{F=cc^(b|(~dd));gi=(7*k)%16}var temp=dd;dd=cc;cc=b;b=(b+c(((a+F+(w[gi]>>>0)+(T[k]>>>0))>>>0),S[k]))>>>0;a=temp}h=(h+a)>>>0;g=(g+b)>>>0;f=(f+cc)>>>0;e=(e+dd)>>>0}var r='';[h,g,f,e].forEach(function(v){for(var i=0;i<4;i++)r+=('0'+((v>>(i*8))&0xff).toString(16)).slice(-2)});return r}

  function getAvatarUrl(user) {
    const sso = user.avatar_url || user.profile_picture || user.photo_url || user.picture || '';
    if (sso) return sso;
    const email = (user.email || '').trim().toLowerCase();
    if (email) return `https://www.gravatar.com/avatar/${md5(email)}?s=96&d=identicon`;
    return '';
  }

  function showUser(user) {
    document.getElementById('user-card').classList.add('show');
    document.getElementById('user-name').textContent = user.display_name || user.cirya_handle || 'User';
    document.getElementById('user-handle').textContent = user.cirya_handle ? '@' + user.cirya_handle : user.email || '';

    const avatar = document.getElementById('user-avatar');
    const pic = getAvatarUrl(user);
    if (pic) {
      avatar.innerHTML = `<img src="${pic}" alt="">`;
    } else {
      avatar.textContent = (user.display_name || '?')[0].toUpperCase();
    }

    const badge = document.getElementById('user-badge');
    const status = user.status || 'Member';
    badge.textContent = status;
    badge.className = 'badge badge-' + status.toLowerCase();

    document.getElementById('login-area').style.display = 'none';
    document.getElementById('btn-enter').style.display = 'block';

    // Store auth in sessionStorage
    sessionStorage.setItem('ciryacast_user', JSON.stringify(user));
  }

  // Check for existing session
  async function checkAuth() {
    if (window.CiryaSSO) {
      const user = await CiryaSSO.user();
      if (user) {
        showUser(user);
        showStatus('Signed in successfully!', 'success');
        return;
      }
    }

    // Check sessionStorage fallback
    const stored = sessionStorage.getItem('ciryacast_user');
    if (stored) {
      try {
        showUser(JSON.parse(stored));
      } catch {}
    }
  }

  // Listen for CiryaSSO events
  function initSSO() {
    if (window.CiryaSSO) {
      CiryaSSO.on('signin', (user) => {
        showUser(user);
        showStatus('Signed in successfully!', 'success');
      });
      checkAuth();
    } else {
      setTimeout(initSSO, 500);
    }
  }

  initSSO();
</script>
</body>
</html>
