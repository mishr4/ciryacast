<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiryaCast Player</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Theme accents — recolored at runtime from the current album art so the
     player matches the music instead of a one-size-fits-all gradient.
     Defaults are a calm single-hue indigo, not the rainbow. */
  :root {
    --accent: #5B5BD6;
    --accent-2: #3A3A8C;
    --accent-soft: rgba(91,91,214,0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Instrument Sans', 'Inter', sans-serif;
    background: #faf8fb;
    color: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    padding: 20px;
    transition: background 0.8s ease;
  }

  .player-wrap {
    width: 440px;
    max-width: 100%;
    text-align: center;
  }

  .player-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .player-header img { width: 28px; height: 28px; border-radius: 6px; object-fit: contain; }
  .player-header span { font-family: 'Lexend', sans-serif; font-size: 14px; font-weight: 600; color: #000; }

  .player-card {
    background: #fff;
    border-radius: 22px;
    padding: 36px 28px;
    box-shadow: 0 1px 21px rgba(0,0,0,0.08);
    margin-bottom: 16px;
  }

  /* Album art */
  .art-container {
    width: 180px;
    height: 180px;
    margin: 0 auto 24px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 16px 44px var(--accent-soft);
    transition: box-shadow 0.8s ease;
  }
  .art-container::before {
    content: '';
    position: absolute;
    width: 300%;
    height: 300%;
    background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.08), transparent);
    animation: spin 10s linear infinite;
  }
  .art-container.playing::before { animation: spin 4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .art-container svg { position: relative; z-index: 1; width: 48px; height: 48px; color: rgba(255,255,255,0.9); }
  .art-container img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; }

  .station-name { font-size: 12px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; transition: color 0.8s ease; }
  .track-title { font-family: 'Lexend', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 4px; min-height: 30px; }
  .track-artist { font-size: 15px; color: #777; font-weight: 500; margin-bottom: 4px; }
  .track-album { font-size: 12px; color: #aaa; font-weight: 500; margin-bottom: 6px; min-height: 16px; }

  /* Progress bar */
  .progress-wrap { width: 100%; margin-bottom: 14px; }
  .progress-times { display: flex; justify-content: space-between; font-size: 11px; color: #999; font-weight: 500; margin-bottom: 4px; }
  .progress-bar { width: 100%; height: 4px; background: #eee; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 1s linear, background 0.8s ease; width: 0%; }

  .request-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .request-badge.hidden { display: none; }
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: #ff1744;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    animation: livePulse 2s ease-in-out infinite;
  }
  .live-badge.hidden { display: none; }
  @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

  .listeners-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    color: #2e7d32;
    padding: 6px 14px;
    border-radius: 20px;
    background: #e8f5e9;
    margin-bottom: 20px;
  }
  .listeners-dot { width: 8px; height: 8px; border-radius: 50%; background: #00C853; box-shadow: 0 0 8px rgba(0,200,83,0.5); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .visualizer { display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 36px; margin-bottom: 20px; }
  .vis-bar { width: 4px; border-radius: 2px; background: var(--accent); opacity: 0.25; will-change: height; }
  .vis-bar.active { opacity: 0.85; }

  .play-btn {
    width: 64px; height: 64px; border-radius: 50%; background: #000; border: none; color: #fff;
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .play-btn svg { width: 24px; height: 24px; }
  .play-btn:hover { transform: scale(1.06); box-shadow: 0 6px 28px rgba(0,0,0,0.2); }
  .play-btn.playing { background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 26px var(--accent-soft); }

  .volume-wrap { display: flex; align-items: center; gap: 10px; justify-content: center; }
  .volume-wrap svg { width: 16px; height: 16px; color: #aaa; }
  input[type="range"] { -webkit-appearance: none; width: 100px; height: 4px; border-radius: 2px; background: #e8e8e8; outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #7C4DFF; cursor: pointer; }

  /* ── Song Request Card ── */
  .request-card {
    background: #fff;
    border-radius: 22px;
    padding: 24px;
    box-shadow: 0 1px 21px rgba(0,0,0,0.08);
    margin-bottom: 16px;
    text-align: left;
  }
  .request-card h3 {
    font-family: 'Lexend', sans-serif;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 14px;
    text-align: center;
  }

  .search-wrap { position: relative; margin-bottom: 8px; }
  .search-input {
    width: 100%;
    padding: 12px 16px 12px 40px;
    background: #fafafa;
    border: 1.5px solid rgba(0,0,0,0.08);
    border-radius: 14px;
    font-family: inherit;
    font-size: 14px;
    color: #000;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search-input:focus { border-color: #7C4DFF; box-shadow: 0 0 0 3px rgba(124,77,255,0.12); }
  .search-input::placeholder { color: #aaa; }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: #aaa;
    pointer-events: none;
  }

  /* Search Results Dropdown */
  .search-results {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    max-height: 280px;
    overflow-y: auto;
    z-index: 50;
    display: none;
    margin-top: 4px;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .search-results.show { display: block; }

  .search-result {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    cursor: pointer;
    transition: background 0.1s;
    border-bottom: 1px solid rgba(0,0,0,0.04);
  }
  .search-result:last-child { border-bottom: none; }
  .search-result:hover { background: #faf8ff; }

  .sr-art {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #fff;
  }
  .sr-art img { width: 100%; height: 100%; object-fit: cover; }
  .sr-meta { flex: 1; overflow: hidden; }
  .sr-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr-artist { font-size: 11px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr-album { font-size: 10px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .search-loading { padding: 16px; text-align: center; font-size: 13px; color: #777; }
  .search-empty { padding: 16px; text-align: center; font-size: 13px; color: #aaa; }

  /* Request status message */
  .request-msg {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    margin-top: 8px;
    display: none;
  }
  .request-msg.show { display: block; }
  .request-msg.success { background: #e8f5e9; color: #2e7d32; }
  .request-msg.info { background: #f0eaff; color: #7C4DFF; }
  .request-msg.error { background: #fce4ec; color: #c62828; }

  /* Request Queue */
  .queue-section { margin-top: 16px; }
  .queue-section h4 { font-size: 12px; font-weight: 600; color: #777; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .queue-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(0,0,0,0.04);
    font-size: 13px;
  }
  .queue-item:last-child { border-bottom: none; }
  .queue-num { width: 20px; text-align: center; font-size: 11px; font-weight: 700; color: #7C4DFF; }
  .queue-info { flex: 1; }
  .queue-info strong { font-weight: 600; }
  .queue-info span { color: #777; }
  .queue-by { font-size: 10px; color: #aaa; }

  /* Recently played */
  .history-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(0,0,0,0.04); }
  .history-row:last-child { border-bottom: none; }
  .history-art { width: 36px; height: 36px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; }
  .history-art img { width: 100%; height: 100%; object-fit: cover; }
  .history-art svg { width: 16px; height: 16px; color: rgba(255,255,255,0.85); }
  .history-meta { flex: 1; min-width: 0; }
  .history-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-artist { font-size: 11px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Stream Link Card */
  .stream-link-card {
    background: #fff;
    border-radius: 16px;
    padding: 16px 20px;
    box-shadow: 0 1px 21px rgba(0,0,0,0.08);
    margin-bottom: 16px;
  }
  .stream-url-input {
    flex: 1;
    padding: 8px 12px;
    background: #f5f5f5;
    border: 1.5px solid rgba(0,0,0,0.06);
    border-radius: 10px;
    font-family: 'Instrument Sans', monospace;
    font-size: 12px;
    color: #333;
    outline: none;
    min-width: 0;
  }
  .stream-copy-btn {
    padding: 8px 16px;
    background: #7C4DFF;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .stream-copy-btn:hover { background: #6a3de8; }

  .player-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 11px;
    color: #bbb;
  }
  .player-footer a { color: #999; text-decoration: none; font-weight: 600; transition: color 0.15s; }
  .player-footer a:hover { color: #7C4DFF; }
</style>
</head>
<body>

<div class="player-wrap">
  <div class="player-header">
    <img src="https://onqhdxzmsvmelmdohcxv.supabase.co/storage/v1/object/public/staff-photos/library/frame-59-7-mpzsv3b7.png" alt="TMC">
    <span>CiryaCast</span>
  </div>

  <!-- Now Playing -->
  <div class="player-card">
    <div class="art-container" id="art-container">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>

    <div class="station-name" id="station-name">Loading...</div>
    <div class="track-title" id="track-title">—</div>
    <div class="track-artist" id="track-artist">—</div>
    <div class="track-album" id="track-album"></div>
    <div class="live-badge hidden" id="live-badge">🎙 Live</div>
    <div class="request-badge hidden" id="request-badge">Listener Request</div>

    <div class="progress-wrap" id="progress-wrap" style="display:none">
      <div class="progress-times">
        <span id="progress-elapsed">0:00</span>
        <span id="progress-duration">0:00</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <div class="listeners-badge">
      <div class="listeners-dot"></div>
      <span><span id="listener-count">0</span> listening</span>
    </div>

    <div class="visualizer" id="visualizer"></div>

    <button class="play-btn" id="play-btn" onclick="togglePlay()">
      <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
    </button>

    <div class="volume-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <input type="range" id="volume" min="0" max="100" value="80" oninput="setVolume(this.value)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    </div>
  </div>

  <!-- Song Request -->
  <div class="request-card">
    <h3>Request a Song</h3>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="search-input" type="text" placeholder="Search for a song..." autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>
    <div class="request-msg" id="request-msg"></div>

    <div class="queue-section" id="queue-section" style="display:none">
      <h4>Request Queue</h4>
      <div id="queue-list"></div>
    </div>

    <div class="queue-section" id="history-section" style="display:none">
      <h4>Recently Played</h4>
      <div id="history-list"></div>
    </div>
  </div>

  <!-- Direct Stream Link -->
  <div class="stream-link-card" id="stream-link-card">
    <div style="display:flex;align-items:center;gap:10px">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7C4DFF" stroke-width="2" style="width:18px;height:18px;flex-shrink:0"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <input type="text" id="stream-url" class="stream-url-input" readonly>
      <button class="stream-copy-btn" id="stream-copy-btn" onclick="copyStreamUrl()">Copy</button>
    </div>
    <p style="font-size:11px;color:#999;margin-top:8px;text-align:center">Use this URL in VLC, foobar2000, or any media player</p>
  </div>

  <div class="player-footer">
    <span>Powered by</span>
    <a href="/">CiryaCast</a>
    <span>&middot;</span>
    <a href="https://tmc.gg" target="_blank">The Mishra Corporation</a>
  </div>
</div>

<audio id="audio" preload="none" crossorigin="anonymous"></audio>

<script>
  // The URL carries a slug or a UUID; we resolve it to the real id on first
  // fetch and rewrite the address bar to the clean slug.
  let stationId = decodeURIComponent(window.location.pathname.split('/')[2] || '');
  let urlNormalized = false;
  const audio = document.getElementById('audio');
  let playing = false;
  let visBars = [];
  let searchTimeout = null;
  let currentMediaId = null;
  let npDuration = 0;
  let npElapsed = 0;

  // No station in the URL → send to the directory
  if (!stationId) { window.location.replace('/stations'); }

  // ── Visualizer ──
  const visEl = document.getElementById('visualizer');
  for (let i = 0; i < 24; i++) {
    const bar = document.createElement('div');
    bar.className = 'vis-bar';
    bar.style.height = '4px';
    visEl.appendChild(bar);
    visBars.push(bar);
  }

  // ── Real audio analysis (Web Audio API) ──
  // The visualizer is driven by the ACTUAL stream's frequency data, not a
  // random animation. Built once on first play (needs a user gesture).
  let audioCtx = null, analyser = null, freqData = null, audioGraphReady = false;
  const smooth = new Array(24).fill(0);

  function setupAudioGraph() {
    if (audioGraphReady) return true;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return false;
      audioCtx = new Ctx();
      const source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;            // 64 frequency bins
      analyser.smoothingTimeConstant = 0.8;
      source.connect(analyser);
      analyser.connect(audioCtx.destination); // keep sound audible
      freqData = new Uint8Array(analyser.frequencyBinCount);
      audioGraphReady = true;
      return true;
    } catch (e) {
      console.warn('Audio analysis unavailable, using fallback:', e.message);
      return false;
    }
  }

  // ── Play/Pause ──
  // The audio stream is ONE continuous HTTP connection — never disconnect
  // it except when the user explicitly pauses.
  function togglePlay() {
    const btn = document.getElementById('play-btn');
    const art = document.getElementById('art-container');
    if (playing) {
      audio.pause();
      audio.src = '';
      playing = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
      btn.classList.remove('playing');
      art.classList.remove('playing');
      visBars.forEach(b => { b.style.height = '4px'; b.classList.remove('active'); });
    } else {
      audio.src = `/listen/${stationId}/radio.mp3`;
      audio.volume = document.getElementById('volume').value / 100;
      audio.play().then(() => {
        setupAudioGraph();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      }).catch(() => {});
      playing = true;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="3" width="5" height="18"/><rect x="14" y="3" width="5" height="18"/></svg>';
      btn.classList.add('playing');
      art.classList.add('playing');
      visBars.forEach(b => b.classList.add('active'));
      animateVis();
    }
  }

  function setVolume(v) { audio.volume = v / 100; }

  function animateVis() {
    if (!playing) return;

    if (analyser && freqData) {
      analyser.getByteFrequencyData(freqData);
      const n = visBars.length;
      // Map the lower ~75% of the spectrum (where music energy lives) onto the bars
      const usable = Math.floor(freqData.length * 0.75);
      for (let i = 0; i < n; i++) {
        const idx = Math.floor((i / n) * usable);
        const v = freqData[idx] / 255;          // 0..1
        // ease + light smoothing so bars feel musical, not jittery
        const target = Math.pow(v, 1.4);
        smooth[i] = smooth[i] * 0.6 + target * 0.4;
        visBars[i].style.height = (3 + smooth[i] * 33).toFixed(1) + 'px';
      }
    } else {
      // Fallback: gentle idle motion if Web Audio isn't available
      visBars.forEach((b, i) => { b.style.height = (4 + Math.abs(Math.sin(Date.now()/300 + i)) * 16).toFixed(1) + 'px'; });
    }
    requestAnimationFrame(animateVis);
  }

  // ── Album-art theming ──
  // Pull a vibrant colour out of the cover and recolour the player around it,
  // the way Spotify/Apple Music do — so it never looks like a canned gradient.
  const DEFAULT_ACCENT = '#5B5BD6', DEFAULT_ACCENT2 = '#3A3A8C';
  let themedFor = '';

  function applyTheme(accent, accent2) {
    const root = document.documentElement.style;
    root.setProperty('--accent', accent);
    root.setProperty('--accent-2', accent2);
    root.setProperty('--accent-soft', hexToRgba(accent, 0.18));
    // a barely-there wash on the page background
    document.body.style.background = `radial-gradient(120% 80% at 50% -10%, ${hexToRgba(accent, 0.10)} 0%, #faf8fb 60%)`;
  }

  function hexToRgba(hex, a) {
    const h = hex.replace('#', '');
    const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function themeFromArtwork(url) {
    if (!url) { themedFor = ''; applyTheme(DEFAULT_ACCENT, DEFAULT_ACCENT2); return; }
    if (url === themedFor) return;
    themedFor = url;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const size = 24, c = document.createElement('canvas');
        c.width = size; c.height = size;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, size, size);
        const data = ctx.getImageData(0, 0, size, size).data;
        let best = null, bestScore = -1, rs=0,gs=0,bs=0,count=0;
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
          if (a < 128) continue;
          rs+=r; gs+=g; bs+=b; count++;
          const max = Math.max(r,g,b), min = Math.min(r,g,b);
          const sat = max === 0 ? 0 : (max - min) / max;
          const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
          // prefer colourful, mid-bright pixels (skip near-white / near-black)
          const score = sat * (1 - Math.abs(lum - 0.5));
          if (score > bestScore && lum > 0.15 && lum < 0.92) { bestScore = score; best = [r,g,b]; }
        }
        if (!best && count) best = [Math.round(rs/count), Math.round(gs/count), Math.round(bs/count)];
        if (!best) { applyTheme(DEFAULT_ACCENT, DEFAULT_ACCENT2); return; }
        const accent = rgbToHex(adjust(best, 0.92));     // slightly deepen for contrast on white
        const accent2 = rgbToHex(adjust(best, 0.55));    // darker partner for the gradient
        applyTheme(accent, accent2);
      } catch (e) {
        // CORS-tainted canvas etc. — keep the default palette
        applyTheme(DEFAULT_ACCENT, DEFAULT_ACCENT2);
      }
    };
    img.onerror = () => applyTheme(DEFAULT_ACCENT, DEFAULT_ACCENT2);
    img.src = url;
  }

  function adjust(rgb, f) { return rgb.map(v => Math.max(0, Math.min(255, Math.round(v * f)))); }
  function rgbToHex([r,g,b]) { return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join(''); }

  // ── Now Playing ──
  function renderHistory(history) {
    const section = document.getElementById('history-section');
    const list = document.getElementById('history-list');
    if (!history || !history.length) { section.style.display = 'none'; return; }
    section.style.display = 'block';
    list.innerHTML = history.map(h => `
      <div class="history-row">
        <div class="history-art">${h.artwork_url
          ? `<img src="${h.artwork_url}" alt="">`
          : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`}</div>
        <div class="history-meta">
          <div class="history-title">${(h.title || '—').replace(/</g,'&lt;')}</div>
          <div class="history-artist">${(h.artist || '').replace(/</g,'&lt;')}</div>
        </div>
      </div>`).join('');
  }

  function updateNowPlaying(data) {
    if (!data) return;
    const np = data.now_playing;
    const art = document.getElementById('art-container');
    const reqBadge = document.getElementById('request-badge');

    // Resolve slug/uuid → real id, and normalize the address bar to the slug
    if (data.station) {
      if (data.station.id) stationId = data.station.id;
      if (!urlNormalized && data.station.slug) {
        history.replaceState(null, '', `/player/${data.station.slug}`);
        const su = document.getElementById('stream-url');
        if (su) su.value = `${location.origin}/listen/${data.station.slug}/radio.mp3`;
        urlNormalized = true;
      }
    }
    renderHistory(data.song_history);

    document.getElementById('station-name').textContent = data.station.name;
    document.title = `${data.station.name} — CiryaCast`;

    if (np) {
      // Detect track change for progress reset
      const newMediaId = np.media_id || null;
      if (newMediaId && newMediaId !== currentMediaId) {
        currentMediaId = newMediaId;
        npElapsed = np.elapsed || 0;
      } else {
        // Accept server elapsed (always authoritative)
        npElapsed = np.elapsed || 0;
      }
      npDuration = np.duration || 0;

      document.getElementById('track-title').textContent = np.title || '—';
      document.getElementById('track-artist').textContent = np.artist || '—';
      document.getElementById('track-album').textContent = np.album || '';

      // Artwork — only update DOM if actually changed
      const artImg = art.querySelector('img');
      if (np.artwork_url) {
        if (!artImg || !artImg.src.includes(np.artwork_url)) {
          art.innerHTML = `<img src="${np.artwork_url}" alt="">`;
        }
        themeFromArtwork(np.artwork_url);   // recolour the player from the cover
      } else if (artImg) {
        art.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
        themeFromArtwork('');               // back to the calm default
      } else {
        themeFromArtwork(np.artwork_url || '');
      }

      // Live badge
      const liveBadge = document.getElementById('live-badge');
      if (data.live) {
        liveBadge.classList.remove('hidden');
      } else {
        liveBadge.classList.add('hidden');
      }

      // Request badge
      if (np.is_request && !data.live) {
        reqBadge.classList.remove('hidden');
      } else {
        reqBadge.classList.add('hidden');
      }
    }

    document.getElementById('listener-count').textContent = data.listeners.current;

    // Update request queue
    if (data.request_queue && data.request_queue.length > 0) {
      document.getElementById('queue-section').style.display = 'block';
      document.getElementById('queue-list').innerHTML = data.request_queue.map((r, i) => `
        <div class="queue-item">
          <div class="queue-num">${i + 1}</div>
          <div class="queue-info">
            <strong>${esc(r.title)}</strong> <span>— ${esc(r.artist)}</span>
          </div>
          <div class="queue-by">${esc(r.requested_by)}</div>
        </div>
      `).join('');
    } else {
      document.getElementById('queue-section').style.display = 'none';
    }
  }

  // Update progress bar every second (client-side tick between server syncs)
  function updateProgress() {
    const progressWrap = document.getElementById('progress-wrap');
    if (npDuration > 0) {
      progressWrap.style.display = 'block';
      const progress = Math.min(100, (npElapsed / npDuration) * 100);
      document.getElementById('progress-elapsed').textContent = fmtDur(npElapsed);
      document.getElementById('progress-duration').textContent = fmtDur(npDuration);
      document.getElementById('progress-fill').style.width = progress + '%';
      npElapsed++;
    } else {
      progressWrap.style.display = 'none';
    }
  }
  setInterval(updateProgress, 1000);

  async function refreshNP() {
    try {
      const res = await fetch(`/api/nowplaying/${encodeURIComponent(stationId)}`);
      if (res.status === 404) {
        // Unknown station → back to the directory
        window.location.replace('/stations');
        return;
      }
      const data = await res.json();
      updateNowPlaying(data);
    } catch {}
  }

  // Set direct stream URL
  const streamUrlInput = document.getElementById('stream-url');
  streamUrlInput.value = `${location.origin}/listen/${stationId}/radio.mp3`;

  function copyStreamUrl() {
    navigator.clipboard.writeText(streamUrlInput.value).then(() => {
      const btn = document.getElementById('stream-copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
    });
  }

  refreshNP();
  // Sync metadata with server every 3s
  setInterval(refreshNP, 3000);

  // ── WebSocket — metadata only, NEVER touch the audio stream ──
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  let ws;
  function connectPlayerWS() {
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onmessage = (e) => {
      const { type, data } = JSON.parse(e.data);
      if ((type === 'track_change' || type === 'nowplaying') && data.stationId === stationId) {
        refreshNP();
      }
      if (type === 'listeners' && data.stationId === stationId) {
        document.getElementById('listener-count').textContent = data.count;
      }
      if (type === 'song_request' && data.stationId === stationId) {
        refreshNP();
      }
    };
    ws.onclose = () => setTimeout(connectPlayerWS, 3000);
  }
  connectPlayerWS();

  // ── Song Request Search ──
  const searchInput = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');
  const requestMsg = document.getElementById('request-msg');

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    clearTimeout(searchTimeout);

    if (q.length < 2) {
      searchResults.classList.remove('show');
      return;
    }

    searchResults.innerHTML = '<div class="search-loading">Searching...</div>';
    searchResults.classList.add('show');

    searchTimeout = setTimeout(async () => {
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const tracks = await res.json();

        if (!Array.isArray(tracks) || tracks.length === 0) {
          searchResults.innerHTML = '<div class="search-empty">No results found</div>';
          return;
        }

        searchResults.innerHTML = tracks.slice(0, 10).map((t, i) => {
          const art = t.album_art || '';
          const title = t.title || t.name || 'Unknown';
          const artist = t.artist || 'Unknown';
          const album = t.album_name || '';
          const tmId = t.deezer_id || t.spotify_id || '';
          const dur = t.duration_sec || 0;
          return `
            <div class="search-result" data-index="${i}"
              onclick='requestSong(${JSON.stringify({
                title: title,
                artist: typeof artist === 'string' ? artist : String(artist),
                album: album,
                artwork_url: art,
                tm_track_id: String(tmId),
                duration: dur,
              }).replace(/'/g, "&#39;")})'
            >
              <div class="sr-art">
                ${art ? `<img src="${art}" alt="" onerror="this.parentNode.textContent='♪'">` : '♪'}
              </div>
              <div class="sr-meta">
                <div class="sr-title">${esc(title)}</div>
                <div class="sr-artist">${esc(typeof artist === 'string' ? artist : String(artist))}</div>
                ${album ? `<div class="sr-album">${esc(album)}</div>` : ''}
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        searchResults.innerHTML = '<div class="search-empty">Search failed — try again</div>';
      }
    }, 350);
  });

  // Close dropdown when clicking outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) {
      searchResults.classList.remove('show');
    }
  });

  async function requestSong(track) {
    searchResults.classList.remove('show');
    searchInput.value = `${track.artist} — ${track.title}`;

    showRequestMsg('Sending request…', 'info');

    try {
      const res = await fetch(`/api/stations/${stationId}/requests`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ...track,
          requested_by: 'Listener',
        }),
      });

      const data = await res.json();

      if (res.ok) {
        if (data.matched) {
          showRequestMsg('In the library — queued up! 🎵', 'success');
        } else {
          showRequestMsg('Request received — a DJ will add it if available 🎶', 'success');
        }
        searchInput.value = '';
        refreshNP();
      } else {
        showRequestMsg(data.error || 'Request failed', 'error');
      }
    } catch (e) {
      showRequestMsg('Request failed — try again', 'error');
    }
  }

  function showRequestMsg(msg, type) {
    requestMsg.textContent = msg;
    requestMsg.className = `request-msg show ${type}`;
    setTimeout(() => { requestMsg.classList.remove('show'); }, 5000);
  }

  function fmtDur(sec) {
    if (!sec) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
</script>
</body>
</html>
