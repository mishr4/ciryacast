<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TMCast Player</title>
<meta name="theme-color" content="#0a0a0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ──────────────────────────────────────────────────────────────
     TMCast Player — SYNK-inspired dark surface.
     Near-black canvas, #171717 cards, rounded-2xl, backdrop-blur
     control bar, cover-art ambient wash. TMCast branding kept;
     --accent is recolored at runtime from the current album art so
     the whole player takes on the mood of the music (Apple-Music style).
     ────────────────────────────────────────────────────────────── */
  :root {
    --accent: #4C8DFF;
    --accent-2: #2f5fb0;
    --accent-soft: rgba(76,141,255,0.16);

    --bg: #0a0a0b;
    --bg-2: #0f0f10;
    --card: #171717;
    --card-2: #1d1d1f;
    --raised: #232326;
    --line: rgba(255,255,255,0.08);
    --line-2: rgba(255,255,255,0.055);
    --ink: #fafafa;
    --ink-2: #e7e7ea;
    --muted: #a1a1aa;
    --faint: #71717a;
    --live: #ff3b46;
    --ok: #34d399;

    --r-lg: 26px;
    --r: 18px;
    --r-sm: 14px;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', system-ui, -apple-system, sans-serif;
    --ease: cubic-bezier(.16,1,.3,1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink-2);
    min-height: 100dvh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    padding: clamp(16px, 4vw, 40px) 16px 48px;
    position: relative;
    overflow-x: hidden;
  }

  /* Ambient cover-art wash behind everything */
  .ambient {
    position: fixed; inset: 0; z-index: -2;
    background-size: cover; background-position: center;
    filter: blur(80px) saturate(1.4);
    opacity: 0; transform: scale(1.25);
    transition: opacity 1.1s ease;
  }
  .ambient.on { opacity: 0.24; }
  .ambient-veil {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,0.03), transparent 60%),
      linear-gradient(180deg, rgba(10,10,11,0.55) 0%, var(--bg) 72%);
  }

  .player-wrap { width: 460px; max-width: 100%; }

  /* ── Brand header ── */
  .player-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; object-fit: contain; }
  .brand b { font-family: var(--serif); font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
  .header-link {
    font-size: 12px; font-weight: 600; color: var(--muted);
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
    transition: color .2s, border-color .2s, background .2s;
  }
  .header-link:hover { color: var(--ink); border-color: var(--line); background: rgba(255,255,255,.04); }
  .header-link svg { width: 13px; height: 13px; }

  /* ── Main now-playing card ── */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: 0 30px 70px -30px rgba(0,0,0,0.85);
  }
  .np-card { padding: 26px 26px 22px; margin-bottom: 16px; }

  /* Album art */
  .art {
    position: relative;
    width: 100%; aspect-ratio: 1;
    border-radius: var(--r);
    overflow: hidden;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 24px 60px -20px var(--accent-soft);
    transition: box-shadow 0.8s ease;
    margin-bottom: 22px;
  }
  .art::after {
    content: ''; position: absolute; inset: 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    border-radius: inherit; pointer-events: none;
  }
  .art .note { width: 30%; height: 30%; color: rgba(255,255,255,0.9); position: relative; z-index: 1; }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
  .art .spin {
    position: absolute; width: 260%; height: 260%;
    background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.07), transparent);
    animation: spin 14s linear infinite; z-index: 0;
  }
  .art.playing .spin { animation-duration: 5s; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Badges row */
  .badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; min-height: 22px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 4px 10px; border-radius: 999px;
  }
  .badge.hidden { display: none; }
  .badge-live { color: #fff; background: var(--live); animation: livePulse 2s ease-in-out infinite; }
  .badge-live::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.72; } }
  .badge-req { color: var(--accent); background: var(--accent-soft); }
  .badge-listeners { color: var(--ink-2); background: rgba(255,255,255,0.05); border: 1px solid var(--line-2); }
  .badge-listeners .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px rgba(52,211,153,0.6); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .station-name { font-size: 11.5px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; transition: color 0.8s ease; }
  .track-title { font-family: var(--serif); font-size: 25px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); line-height: 1.15; margin-bottom: 4px; min-height: 30px; }
  .track-artist { font-size: 15.5px; color: var(--muted); font-weight: 500; }
  .track-album { font-size: 12.5px; color: var(--faint); font-weight: 500; margin-top: 3px; min-height: 15px; }

  /* Progress */
  .progress-wrap { margin: 18px 0 4px; }
  .progress-times { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); font-weight: 500; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .progress-bar { width: 100%; height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 1s linear, background 0.8s ease; width: 0%; }

  /* ── Control bar (backdrop-blur glass) ── */
  .controls {
    display: flex; align-items: center; gap: 16px;
    margin-top: 20px; padding: 14px 16px;
    background: rgba(255,255,255,0.045);
    border: 1px solid var(--line-2);
    border-radius: var(--r);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  }
  .play-btn {
    flex-shrink: 0;
    width: 58px; height: 58px; border-radius: 50%;
    background: var(--accent); border: none; color: #0a0a0b;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 28px -6px var(--accent-soft);
    transition: transform 0.18s var(--ease), filter 0.18s;
  }
  .play-btn svg { width: 24px; height: 24px; }
  .play-btn:hover { transform: scale(1.06); filter: brightness(1.08); }
  .play-btn:active { transform: scale(0.98); }

  .visualizer { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 40px; overflow: hidden; }
  .vis-bar { width: 4px; border-radius: 2px; background: var(--accent); opacity: 0.28; will-change: height; }
  .vis-bar.active { opacity: 0.85; }

  .volume-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .volume-wrap svg { width: 16px; height: 16px; color: var(--faint); }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 76px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); outline: none; cursor: pointer; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 0 4px rgba(0,0,0,0.25); }
  input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: var(--accent); cursor: pointer; }

  /* ── Secondary action row ── */
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .action-btn {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px; border-radius: var(--r-sm);
    background: rgba(255,255,255,0.045); border: 1px solid var(--line-2); color: var(--ink-2);
    font-family: var(--sans); font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: background 0.18s, border-color 0.18s, color 0.18s, transform 0.1s;
    text-decoration: none;
  }
  .action-btn svg { width: 16px; height: 16px; }
  .action-btn:hover { background: rgba(255,255,255,0.08); color: var(--ink); border-color: var(--line); }
  .action-btn:active { transform: scale(0.99); }
  .action-btn[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }

  /* ── Generic section card ── */
  .sec { padding: 22px 24px; margin-bottom: 16px; }
  .sec-title { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .sec-title svg { width: 14px; height: 14px; color: var(--faint); }

  /* ── Song request ── */
  .request-toggle {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 15px; background: var(--accent); color: #0a0a0b; border: none; border-radius: var(--r-sm);
    font-family: var(--serif); font-size: 15px; font-weight: 600; cursor: pointer;
    transition: filter 0.15s, transform 0.1s;
  }
  .request-toggle:hover { filter: brightness(1.06); }
  .request-toggle:active { transform: scale(0.99); }
  .request-toggle svg { width: 18px; height: 18px; }
  .request-panel { display: none; }
  .request-card.open .request-toggle { display: none; }
  .request-card.open .request-panel { display: block; }
  .request-panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .request-close { flex-shrink: 0; width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--line-2); color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; transition: background 0.15s, color 0.15s; }
  .request-close:hover { background: rgba(255,255,255,0.09); color: var(--ink); }
  .req-counter { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; font-weight: 500; }
  .req-counter strong { color: var(--accent); }

  .search-wrap { position: relative; flex: 1; }
  .search-input { width: 100%; padding: 12px 16px 12px 40px; background: rgba(255,255,255,0.045); border: 1px solid var(--line); border-radius: 12px; font-family: inherit; font-size: 14px; color: var(--ink); outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-input::placeholder { color: var(--faint); }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); pointer-events: none; }

  .lib-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-height: 340px; overflow-y: auto; overflow-x: hidden; padding: 2px; }
  .lib-tile { cursor: pointer; text-align: left; min-width: 0; }
  .lib-cover { position: relative; width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--raised); display: flex; align-items: center; justify-content: center; transition: transform 0.12s, box-shadow 0.12s; }
  .lib-tile:hover .lib-cover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,0.5); }
  .lib-cover .cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .lib-cover svg { width: 24px; height: 24px; color: var(--faint); }
  .lib-tile-title { font-size: 12px; font-weight: 600; color: var(--ink-2); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lib-tile-artist { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lib-empty { grid-column: 1 / -1; text-align: center; padding: 28px 10px; font-size: 13px; color: var(--faint); }

  .lib-detail { display: none; }
  .request-card.detail .request-panel { display: none; }
  .request-card.detail .lib-detail { display: block; }
  .lib-detail-inner { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8px 4px 4px; }
  .lib-detail-cover { position: relative; width: 170px; height: 170px; border-radius: 16px; overflow: hidden; margin-bottom: 16px; background: var(--raised); display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
  .lib-detail-cover .cover-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .lib-detail-cover svg { width: 46px; height: 46px; color: var(--faint); }
  .lib-detail h3 { font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
  .lib-detail p { font-size: 14px; color: var(--muted); margin-bottom: 18px; }
  .lib-detail-actions { display: flex; gap: 10px; width: 100%; }
  .lib-btn { flex: 1; padding: 13px; border-radius: 12px; border: none; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; transition: filter 0.15s, background 0.15s; }
  .lib-btn-add { background: var(--accent); color: #0a0a0b; }
  .lib-btn-add:hover { filter: brightness(1.06); }
  .lib-btn-add:disabled { background: var(--raised); color: var(--faint); cursor: not-allowed; filter: none; }
  .lib-btn-back { background: rgba(255,255,255,0.05); color: var(--muted); flex: 0 0 90px; }
  .lib-btn-back:hover { background: rgba(255,255,255,0.09); color: var(--ink); }

  .request-msg { padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; text-align: center; margin-top: 12px; display: none; }
  .request-msg.show { display: block; }
  .request-msg.success { background: rgba(52,211,153,0.12); color: #6ee7b7; }
  .request-msg.info { background: var(--accent-soft); color: var(--accent); }
  .request-msg.error { background: rgba(255,59,70,0.12); color: #ff8a8a; }

  /* Queue + history rows */
  .queue-section { margin-top: 18px; }
  .queue-section h4 { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; }
  .queue-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
  .queue-item:last-child { border-bottom: none; }
  .queue-num { width: 20px; text-align: center; font-size: 11px; font-weight: 700; color: var(--accent); }
  .queue-info { flex: 1; min-width: 0; }
  .queue-info strong { font-weight: 600; color: var(--ink-2); }
  .queue-info span { color: var(--muted); }
  .queue-by { font-size: 10px; color: var(--faint); }

  .history-row { display: flex; align-items: center; gap: 11px; padding: 8px 0; border-bottom: 1px solid var(--line-2); }
  .history-row:last-child { border-bottom: none; }
  .history-art { width: 38px; height: 38px; border-radius: 9px; overflow: hidden; flex-shrink: 0; background: var(--raised); display: flex; align-items: center; justify-content: center; }
  .history-art img { width: 100%; height: 100%; object-fit: cover; }
  .history-art svg { width: 16px; height: 16px; color: var(--faint); }
  .history-meta { flex: 1; min-width: 0; }
  .history-title { font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-artist { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Listen anywhere ── */
  .stream-formats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .fmt-btn { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--line-2); color: var(--ink-2); text-decoration: none; transition: background 0.15s, border-color 0.15s; }
  .fmt-btn:hover { background: rgba(255,255,255,0.075); border-color: var(--line); }
  .fmt-btn .fmt-ic { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .fmt-btn .fmt-ic svg { width: 15px; height: 15px; }
  .fmt-btn b { display: block; font-size: 13px; font-weight: 600; color: var(--ink); }
  .fmt-btn small { display: block; font-size: 10.5px; color: var(--faint); }
  .stream-url-row { display: flex; align-items: center; gap: 10px; }
  .stream-url-input { flex: 1; padding: 10px 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--line-2); border-radius: 10px; font-family: var(--sans); font-size: 12px; color: var(--muted); outline: none; min-width: 0; }
  .stream-copy-btn { padding: 10px 16px; background: var(--accent); color: #0a0a0b; border: none; border-radius: 10px; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; transition: filter 0.15s; white-space: nowrap; }
  .stream-copy-btn:hover { filter: brightness(1.08); }
  .stream-hint { font-size: 11px; color: var(--faint); margin-top: 10px; text-align: center; }

  .player-footer { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11.5px; color: var(--faint); margin-top: 6px; }
  .player-footer a { color: var(--muted); font-weight: 600; transition: color 0.15s; }
  .player-footer a:hover { color: var(--accent); }

  @media (max-width: 480px) {
    .np-card { padding: 20px 18px 18px; }
    .sec { padding: 20px 18px; }
    .track-title { font-size: 22px; }
    .stream-formats { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="ambient" id="ambient"></div>
<div class="ambient-veil"></div>

<div class="player-wrap">
  <div class="player-header">
    <a class="brand" href="/stations">
      <img src="/logo.png" alt="TMC">
      <b>TMCast</b>
    </a>
    <a class="header-link" href="/stations">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      All stations
    </a>
  </div>

  <!-- Now Playing -->
  <div class="card np-card">
    <div class="art" id="art-container">
      <div class="spin"></div>
      <svg class="note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>

    <div class="badges">
      <span class="badge badge-live hidden" id="live-badge">Live</span>
      <span class="badge badge-req hidden" id="request-badge">Listener Request</span>
      <span class="badge badge-listeners"><span class="dot"></span><span id="listener-count">0</span> listening</span>
    </div>

    <div class="station-name" id="station-name">Loading…</div>
    <div class="track-title" id="track-title">—</div>
    <div class="track-artist" id="track-artist">—</div>
    <div class="track-album" id="track-album"></div>

    <div class="progress-wrap" id="progress-wrap" style="display:none">
      <div class="progress-times">
        <span id="progress-elapsed">0:00</span>
        <span id="progress-duration">0:00</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="controls">
      <button class="play-btn" id="play-btn" onclick="togglePlay()" aria-label="Play">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      </button>
      <div class="visualizer" id="visualizer"></div>
      <div class="volume-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        <input type="range" id="volume" min="0" max="100" value="80" oninput="setVolume(this.value)" aria-label="Volume">
      </div>
    </div>

    <div class="actions">
      <a class="action-btn" id="download-btn" href="#" target="_blank" rel="noopener" aria-disabled="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </a>
      <button class="action-btn" id="share-btn" onclick="sharePlayer()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Share
      </button>
    </div>
  </div>

  <!-- Song Request -->
  <div class="card sec request-card">
    <button class="request-toggle" id="request-toggle" onclick="openRequest()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      Request a Song
    </button>

    <div class="request-panel" id="request-panel">
      <div class="request-panel-head">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="search-input" id="lib-search" type="text" placeholder="Search available songs…" autocomplete="off">
        </div>
        <button class="request-close" onclick="closeRequest()" aria-label="Close">&times;</button>
      </div>
      <div class="req-counter" id="req-counter"></div>
      <div class="lib-grid" id="lib-grid"></div>
    </div>

    <div class="lib-detail" id="lib-detail"></div>
    <div class="request-msg" id="request-msg"></div>

    <div class="queue-section" id="queue-section" style="display:none">
      <h4>Request Queue</h4>
      <div id="queue-list"></div>
    </div>

    <div class="queue-section" id="history-section" style="display:none">
      <h4>Recently Played</h4>
      <div id="history-list"></div>
    </div>
  </div>

  <!-- Listen Anywhere -->
  <div class="card sec">
    <div class="sec-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      Listen anywhere
    </div>
    <div class="stream-formats">
      <a class="fmt-btn" id="fmt-m3u" href="#" target="_blank" rel="noopener">
        <span class="fmt-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg></span>
        <span><b>M3U</b><small>VLC · car stereo</small></span>
      </a>
      <a class="fmt-btn" id="fmt-pls" href="#" target="_blank" rel="noopener">
        <span class="fmt-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></span>
        <span><b>PLS</b><small>TuneIn · directories</small></span>
      </a>
    </div>
    <div class="stream-url-row">
      <input type="text" id="stream-url" class="stream-url-input" readonly>
      <button class="stream-copy-btn" id="stream-copy-btn" onclick="copyStreamUrl()">Copy</button>
    </div>
    <p class="stream-hint">Direct Icecast MP3 — paste into VLC, foobar2000, Radio Garden or any player</p>
  </div>

  <div class="player-footer">
    <span>Powered by</span>
    <a href="/">TMCast</a>
    <span>&middot;</span>
    <a href="https://tmc.gg" target="_blank" rel="noopener">The Mavion Corporation</a>
  </div>
</div>

<audio id="audio" preload="none" crossorigin="anonymous"></audio>

<script>
  // The URL carries a slug or a UUID; we resolve it to the real id on first
  // fetch and rewrite the address bar to the clean slug.
  let stationId = decodeURIComponent(window.location.pathname.split('/')[2] || '');
  let stationSlug = stationId;
  let urlNormalized = false;
  const audio = document.getElementById('audio');
  let playing = false;
  let visBars = [];
  let searchTimeout = null;
  let currentMediaId = null;
  let npDuration = 0;
  let npElapsed = 0;
  let currentTrack = null;   // { title, artist } of what's on now — powers the download button

  // No station in the URL → send to the directory
  if (!stationId) { window.location.replace('/stations'); }

  // ── Visualizer ──
  const visEl = document.getElementById('visualizer');
  for (let i = 0; i < 28; i++) {
    const bar = document.createElement('div');
    bar.className = 'vis-bar';
    bar.style.height = '4px';
    visEl.appendChild(bar);
    visBars.push(bar);
  }

  // ── Real audio analysis (Web Audio API) ──
  let audioCtx = null, analyser = null, freqData = null, audioGraphReady = false;
  const smooth = new Array(28).fill(0);

  function setupAudioGraph() {
    if (audioGraphReady) return true;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return false;
      audioCtx = new Ctx();
      const source = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      analyser.smoothingTimeConstant = 0.8;
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      freqData = new Uint8Array(analyser.frequencyBinCount);
      audioGraphReady = true;
      return true;
    } catch (e) {
      console.warn('Audio analysis unavailable, using fallback:', e.message);
      return false;
    }
  }

  // ── Play/Pause ── (one continuous HTTP connection; only cut on explicit pause)
  function togglePlay() {
    const btn = document.getElementById('play-btn');
    const art = document.getElementById('art-container');
    if (playing) {
      audio.pause();
      audio.src = '';
      playing = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
      btn.setAttribute('aria-label', 'Play');
      art.classList.remove('playing');
      visBars.forEach(b => { b.style.height = '4px'; b.classList.remove('active'); });
    } else {
      audio.src = `/listen/${stationId}/radio.mp3`;
      audio.volume = document.getElementById('volume').value / 100;
      audio.play().then(() => {
        setupAudioGraph();
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      }).catch(() => {});
      playing = true;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="3" width="5" height="18" rx="1"/><rect x="14" y="3" width="5" height="18" rx="1"/></svg>';
      btn.setAttribute('aria-label', 'Pause');
      art.classList.add('playing');
      visBars.forEach(b => b.classList.add('active'));
      animateVis();
    }
  }

  function setVolume(v) { audio.volume = v / 100; }

  function animateVis() {
    if (!playing) return;
    if (analyser && freqData) {
      analyser.getByteFrequencyData(freqData);
      const n = visBars.length;
      const usable = Math.floor(freqData.length * 0.75);
      for (let i = 0; i < n; i++) {
        const idx = Math.floor((i / n) * usable);
        const v = freqData[idx] / 255;
        const target = Math.pow(v, 1.4);
        smooth[i] = smooth[i] * 0.6 + target * 0.4;
        visBars[i].style.height = (3 + smooth[i] * 34).toFixed(1) + 'px';
      }
    } else {
      visBars.forEach((b, i) => { b.style.height = (4 + Math.abs(Math.sin(Date.now()/300 + i)) * 16).toFixed(1) + 'px'; });
    }
    requestAnimationFrame(animateVis);
  }

  // ── Album-art theming — pull a vibrant colour and recolour the player ──
  const DEFAULT_ACCENT = '#4C8DFF', DEFAULT_ACCENT2 = '#2f5fb0';
  let themedFor = '';

  function applyTheme(accent, accent2) {
    const root = document.documentElement.style;
    root.setProperty('--accent', accent);
    root.setProperty('--accent-2', accent2);
    root.setProperty('--accent-soft', hexToRgba(accent, 0.18));
  }
  function hexToRgba(hex, a) {
    const h = hex.replace('#', '');
    const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }
  function setAmbient(url) {
    const amb = document.getElementById('ambient');
    if (url) { amb.style.backgroundImage = `url("${url}")`; amb.classList.add('on'); }
    else { amb.classList.remove('on'); }
  }

  function themeFromArtwork(url) {
    if (!url) { themedFor = ''; applyTheme(DEFAULT_ACCENT, DEFAULT_ACCENT2); setAmbient(''); return; }
    if (url === themedFor) return;
    themedFor = url;
    setAmbient(url);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const size = 24, c = document.createElement('canvas');
        c.width = size; c.height = size;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, size, size);
        const data = ctx.getImageData(0, 0, size, size).data;
        let best = null, bestScore = -1, rs=0,gs=0,bs=0,count=0;
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
          if (a < 128) continue;
          rs+=r; gs+=g; bs+=b; count++;
          const max = Math.max(r,g,b), min = Math.min(r,g,b);
          const sat = max === 0 ? 0 : (max - min) / max;
          const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
          const score = sat * (1 - Math.abs(lum - 0.5));
          if (score > bestScore && lum > 0.15 && lum < 0.92) { bestScore = score; best = [r,g,b]; }
        }
        if (!best && count) best = [Math.round(rs/count), Math.round(gs/count), Math.round(bs/count)];
        if (!best) { applyTheme(DEFAULT_ACCENT, DEFAULT_ACCENT2); return; }
        // On the dark surface we brighten the picked colour a touch for contrast.
        const accent = rgbToHex(adjust(best, 1.12));
        const accent2 = rgbToHex(adjust(best, 0.7));
        applyTheme(accent, accent2);
      } catch (e) {
        applyTheme(DEFAULT_ACCENT, DEFAULT_ACCENT2);
      }
    };
    img.onerror = () => applyTheme(DEFAULT_ACCENT, DEFAULT_ACCENT2);
    img.src = url;
  }
  function adjust(rgb, f) { return rgb.map(v => Math.max(0, Math.min(255, Math.round(v * f)))); }
  function rgbToHex([r,g,b]) { return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join(''); }

  // ── Download button — links the current track to the DDL service ──
  const DDL_BASE = 'https://ddl.synkradio.co.uk/listen';
  function updateDownloadBtn(np, isLive) {
    const btn = document.getElementById('download-btn');
    const title = np && np.title ? String(np.title).trim() : '';
    const artist = np && np.artist ? String(np.artist).trim() : '';
    // Only offer a download for a real, named music track — not a live show
    // or an empty/placeholder slot.
    const ok = !isLive && title && artist && artist.toLowerCase() !== 'unknown';
    if (ok) {
      btn.href = `${DDL_BASE}?artist=${encodeURIComponent(artist)}&title=${encodeURIComponent(title)}`;
      btn.setAttribute('aria-disabled', 'false');
      btn.setAttribute('title', `Download “${title}” — ${artist}`);
    } else {
      btn.href = '#';
      btn.setAttribute('aria-disabled', 'true');
      btn.removeAttribute('title');
    }
  }

  // ── Recently played ──
  let _historySig = '';
  function renderHistory(history) {
    const section = document.getElementById('history-section');
    const list = document.getElementById('history-list');
    if (!history || !history.length) { section.style.display = 'none'; return; }
    const sig = history.map(h => h.title + '|' + h.artist).join('~');
    if (sig === _historySig) { section.style.display = 'block'; return; }
    _historySig = sig;
    section.style.display = 'block';
    list.innerHTML = history.map(h => `
      <div class="history-row">
        <div class="history-art">${h.artwork_url
          ? `<img src="${esc(h.artwork_url)}" alt="" onerror="this.remove()">`
          : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`}</div>
        <div class="history-meta">
          <div class="history-title">${esc(h.title || '—')}</div>
          <div class="history-artist">${esc(h.artist || '')}</div>
        </div>
      </div>`).join('');
  }

  function updateNowPlaying(data) {
    if (!data) return;
    const np = data.now_playing;
    const art = document.getElementById('art-container');
    const reqBadge = document.getElementById('request-badge');

    if (data.station) {
      if (data.station.id) stationId = data.station.id;
      if (data.station.slug) stationSlug = data.station.slug;
      if (!urlNormalized && data.station.slug) {
        history.replaceState(null, '', `/player/${data.station.slug}`);
        urlNormalized = true;
      }
      updateStreamLinks();
    }
    renderHistory(data.song_history);

    document.getElementById('station-name').textContent = data.station.name;
    document.title = `${data.station.name} — TMCast`;

    currentTrack = np ? { title: np.title, artist: np.artist } : null;
    updateDownloadBtn(np, data.live);

    if (np) {
      const newMediaId = np.media_id || null;
      npElapsed = np.elapsed || 0;
      if (newMediaId && newMediaId !== currentMediaId) currentMediaId = newMediaId;
      npDuration = np.duration || 0;

      document.getElementById('track-title').textContent = np.title || '—';
      document.getElementById('track-artist').textContent = np.artist || '—';
      document.getElementById('track-album').textContent = np.album || '';

      const noteSvg = '<div class="spin"></div><svg class="note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
      const artImg = art.querySelector('img');
      const playingCls = art.classList.contains('playing');
      if (np.artwork_url) {
        if (!artImg || !artImg.src.includes(np.artwork_url)) {
          art.innerHTML = '<img alt="">';
          const im = art.querySelector('img');
          im.onerror = () => { if (art.querySelector('img') === im) { art.innerHTML = noteSvg; themeFromArtwork(''); if (playingCls) art.classList.add('playing'); } };
          im.src = np.artwork_url;
        }
        themeFromArtwork(np.artwork_url);
      } else if (artImg) {
        art.innerHTML = noteSvg;
        themeFromArtwork('');
      } else {
        themeFromArtwork(np.artwork_url || '');
      }
      if (playingCls) art.classList.add('playing');

      const liveBadge = document.getElementById('live-badge');
      if (data.live) {
        liveBadge.textContent = data.simulcast
          ? ('Simulcast' + (data.simulcast.partner ? ' · ' + data.simulcast.partner : ''))
          : 'Live';
        liveBadge.classList.remove('hidden');
      } else {
        liveBadge.classList.add('hidden');
      }

      if (np.is_request && !data.live) reqBadge.classList.remove('hidden');
      else reqBadge.classList.add('hidden');
    }

    document.getElementById('listener-count').textContent = data.listeners.current;

    if (data.request_queue && data.request_queue.length > 0) {
      document.getElementById('queue-section').style.display = 'block';
      document.getElementById('queue-list').innerHTML = data.request_queue.map((r, i) => `
        <div class="queue-item">
          <div class="queue-num">${i + 1}</div>
          <div class="queue-info"><strong>${esc(r.title)}</strong> <span>— ${esc(r.artist)}</span></div>
          <div class="queue-by">${esc(r.requested_by)}</div>
        </div>`).join('');
    } else {
      document.getElementById('queue-section').style.display = 'none';
    }
  }

  function updateProgress() {
    const progressWrap = document.getElementById('progress-wrap');
    if (npDuration > 0) {
      progressWrap.style.display = 'block';
      const shown = Math.min(npElapsed, npDuration);
      const progress = Math.min(100, (shown / npDuration) * 100);
      document.getElementById('progress-elapsed').textContent = fmtDur(shown);
      document.getElementById('progress-duration').textContent = fmtDur(npDuration);
      document.getElementById('progress-fill').style.width = progress + '%';
      if (npElapsed < npDuration) npElapsed++;
    } else {
      progressWrap.style.display = 'none';
    }
  }
  setInterval(updateProgress, 1000);

  async function refreshNP() {
    try {
      const res = await fetch(`/api/nowplaying/${encodeURIComponent(stationId)}`);
      if (res.status === 404) { window.location.replace('/stations'); return; }
      const data = await res.json();
      updateNowPlaying(data);
    } catch {}
  }

  // ── Stream URLs (MP3 / M3U / PLS) ──
  function updateStreamLinks() {
    const s = encodeURIComponent(stationSlug || stationId);
    const mp3 = `${location.origin}/listen/${s}/radio.mp3`;
    document.getElementById('stream-url').value = mp3;
    document.getElementById('fmt-m3u').href = `${location.origin}/listen/${s}/radio.m3u`;
    document.getElementById('fmt-pls').href = `${location.origin}/listen/${s}/radio.pls`;
  }
  updateStreamLinks();

  function copyStreamUrl() {
    const val = document.getElementById('stream-url').value;
    navigator.clipboard.writeText(val).then(() => {
      const btn = document.getElementById('stream-copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
    });
  }

  function sharePlayer() {
    const url = `${location.origin}/player/${stationSlug || stationId}`;
    const name = document.getElementById('station-name').textContent || 'TMCast';
    if (navigator.share) {
      navigator.share({ title: name, text: `Listen to ${name} on TMCast`, url }).catch(() => {});
    } else {
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('share-btn');
        const orig = btn.innerHTML;
        btn.innerHTML = 'Link copied!';
        setTimeout(() => { btn.innerHTML = orig; }, 2000);
      });
    }
  }

  refreshNP();
  setInterval(refreshNP, 5000);

  // ── WebSocket — metadata only, NEVER touch the audio stream ──
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  let ws;
  function connectPlayerWS() {
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onmessage = (e) => {
      const { type, data } = JSON.parse(e.data);
      if ((type === 'track_change' || type === 'nowplaying') && data.stationId === stationId) refreshNP();
      if (type === 'listeners' && data.stationId === stationId) document.getElementById('listener-count').textContent = data.count;
      if (type === 'song_request' && data.stationId === stationId) refreshNP();
    };
    ws.onclose = () => setTimeout(connectPlayerWS, 3000);
  }
  connectPlayerWS();

  // ── Song Request: browse the available library ──
  const MAX_REQUESTS = 2;
  const requestCard = document.querySelector('.request-card');
  const libSearch = document.getElementById('lib-search');
  const libGrid = document.getElementById('lib-grid');
  const libDetail = document.getElementById('lib-detail');
  const requestMsg = document.getElementById('request-msg');
  let library = [];
  let libLoaded = false;
  let requestsUsed = 0;
  const NOTE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';

  function updateCounter() {
    const el = document.getElementById('req-counter');
    const left = Math.max(0, MAX_REQUESTS - requestsUsed);
    el.innerHTML = left > 0
      ? `Pick up to <strong>${left}</strong> song${left !== 1 ? 's' : ''} from the library`
      : `You've queued your <strong>${MAX_REQUESTS}</strong> songs — enjoy! 🎶`;
  }

  async function openRequest() {
    requestCard.classList.add('open');
    updateCounter();
    if (!libLoaded) {
      libGrid.innerHTML = '<div class="lib-empty">Loading…</div>';
      try {
        library = await fetch(`/api/stations/${stationId}/library`).then(r => r.json());
        libLoaded = true;
      } catch { library = []; }
    }
    renderLibrary(libSearch.value.trim());
    setTimeout(() => libSearch.focus(), 50);
  }
  function closeRequest() { requestCard.classList.remove('open', 'detail'); }
  window.openRequest = openRequest;
  window.closeRequest = closeRequest;

  function renderLibrary(q) {
    let list = library;
    if (q) {
      const s = q.toLowerCase();
      list = library.filter(t =>
        (t.title || '').toLowerCase().includes(s) ||
        (t.artist || '').toLowerCase().includes(s) ||
        (t.album || '').toLowerCase().includes(s));
    }
    if (!list.length) {
      libGrid.innerHTML = `<div class="lib-empty">${library.length ? 'No songs match your search' : 'No songs available yet'}</div>`;
      return;
    }
    libGrid.innerHTML = list.slice(0, 60).map(t => `
      <div class="lib-tile" onclick="expandTrack('${t.id}')">
        <div class="lib-cover">${NOTE_SVG}${t.artwork_url
          ? `<img class="cover-img" src="${esc(t.artwork_url)}" alt="" loading="lazy" onerror="this.remove()">`
          : ''}</div>
        <div class="lib-tile-title">${esc(t.title)}</div>
        <div class="lib-tile-artist">${esc(t.artist)}</div>
      </div>`).join('');
  }

  libSearch.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => renderLibrary(libSearch.value.trim()), 150);
  });

  function expandTrack(id) {
    const t = library.find(x => x.id === id);
    if (!t) return;
    const atLimit = requestsUsed >= MAX_REQUESTS;
    libDetail.innerHTML = `
      <div class="lib-detail-inner">
        <div class="lib-detail-cover">${NOTE_SVG}${t.artwork_url ? `<img class="cover-img" src="${esc(t.artwork_url)}" alt="" onerror="this.remove()">` : ''}</div>
        <h3>${esc(t.title)}</h3>
        <p>${esc(t.artist)}${t.album ? ' · ' + esc(t.album) : ''}</p>
        <div class="lib-detail-actions">
          <button class="lib-btn lib-btn-back" onclick="backToGrid()">Back</button>
          <button class="lib-btn lib-btn-add" id="lib-add-btn" ${atLimit ? 'disabled' : ''} onclick="addRequest('${t.id}')">
            ${atLimit ? 'Queue full' : '＋ Add to Queue'}
          </button>
        </div>
      </div>`;
    requestCard.classList.add('detail');
  }
  function backToGrid() { requestCard.classList.remove('detail'); }
  window.expandTrack = expandTrack;
  window.backToGrid = backToGrid;

  async function addRequest(id) {
    const btn = document.getElementById('lib-add-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Adding…'; }
    try {
      const res = await fetch(`/api/stations/${stationId}/requests`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ media_id: id, requested_by: 'Listener' }),
      });
      const data = await res.json();
      if (res.ok) {
        requestsUsed = MAX_REQUESTS - (typeof data.remaining === 'number' ? data.remaining : MAX_REQUESTS - requestsUsed - 1);
        requestCard.classList.remove('detail');
        updateCounter();
        showRequestMsg('Added to the queue! 🎵', 'success');
        refreshNP();
        if (requestsUsed >= MAX_REQUESTS) setTimeout(closeRequest, 1200);
      } else {
        if (res.status === 429) requestsUsed = MAX_REQUESTS;
        updateCounter();
        showRequestMsg(data.error || 'Could not add', 'error');
        if (btn) { btn.disabled = false; btn.textContent = '＋ Add to Queue'; }
      }
    } catch {
      showRequestMsg('Request failed — try again', 'error');
      if (btn) { btn.disabled = false; btn.textContent = '＋ Add to Queue'; }
    }
  }
  window.addRequest = addRequest;

  function showRequestMsg(msg, type) {
    requestMsg.textContent = msg;
    requestMsg.className = `request-msg show ${type}`;
    setTimeout(() => { requestMsg.classList.remove('show'); }, 5000);
  }

  function fmtDur(sec) {
    if (!sec) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, '0')}`;
  }
  function esc(s) {
    if (s === null || s === undefined) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
</script>
